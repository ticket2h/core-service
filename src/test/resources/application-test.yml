spring:
  datasource:
    hikari:
      maximum-pool-size: 20      # test đồng thời mở nhiều kết nối cùng lúc
  kafka:
    consumer:
      auto-offset-reset: earliest

ticket2h:
  jobs:
    enabled: false               # test tự gọi job bằng tay
  waiting-room:
    secret: test-waiting-room-secret-0123456789abcdef
  rate-limit:
    # Mọi test gọi từ 127.0.0.1: xô rất lớn để không test nào bị chặn. RateLimitIT làm cạn xô bằng tay rồi kiểm tra
    per-ip: { capacity: 1000000, refill-per-second: 1 }
    orders: { capacity: 1000000, refill-per-second: 1 }
    waiting-room: { capacity: 1000000, refill-per-second: 1 }
  cache:
    event-ttl: PT0S              # không cache: test đọc lại ngay sau khi đổi; SeatMapCacheIT bật lại
    seat-map-ttl: PT0S
  payment:
    mockpay:
      api-key: test-api-key
      webhook-secret: test-webhook-secret
      connect-timeout: PT1S
      read-timeout: PT2S
  # jwt.jwk-set-uri, identity-api.base-url: FakeIdentity (IntegrationTest đặt lúc chạy)
  identity-api:
    api-key: test-internal-key-core-0123456789abcdef
    connect-timeout: PT1S
    read-timeout: PT2S
  internal-api:
    clients:
      notification-service: test-internal-key-notification-0123456789
  # qr.private-key / qr.public-keys: sinh ngẫu nhiên lúc chạy test (TestKeys), không commit khoá nào

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
