spring:
  application:
    name: core-service
  config:
    # Secret dùng chung cho cả hệ thống nằm ở ../infra/.env (tạo bằng infra/scripts/init-env.sh), không commit.
    # File .env cạnh pom.xml (nếu có) dùng để ghi đè riêng cho service này.
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # Database riêng của core-service (infra/postgres/init tạo user và database "core")
    url: jdbc:postgresql://localhost:5432/core
    username: core
    password: core
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway quản lý schema
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        # Kafka sập thì relay báo lỗi sau vài giây thay vì treo 60 giây
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      properties:
        # App bị kill -9 thì consumer cũ còn "sống" trong group đến hết session timeout (mặc định 45s),
        # consumer mới phải chờ chừng đó mới nhận partition. 10s để khởi động lại nhanh hơn.
        session.timeout.ms: 10000
  task:
    scheduling:
      pool:
        size: 4             # job hết hạn, hoàn tiền, relay không chờ nhau

server:
  port: 8080

springdoc:
  # Mặc định springdoc ghi "*/*" cho mọi response; ghi rõ JSON để kiểu TypeScript sinh ra (web-app) gọn hơn
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

ticket2h:
  jobs:
    enabled: true                 # tắt trong test để tự gọi job bằng tay
  order:
    hold-duration: PT10M          # giữ chỗ 10 phút
    expiry-grace: PT1M            # chờ thêm 1 phút trước khi dọn đơn hết hạn
    payment-extension: PT15M      # gia hạn giữ chỗ khi bắt đầu thanh toán
    max-payment-attempts: 3
  payment:
    mockpay:
      base-url: http://localhost:9090
      api-key: ${MOCKPAY_API_KEY}
      webhook-secret: ${MOCKPAY_WEBHOOK_SECRET}
      # Trình duyệt quay về đây sau trang MockPay: core thêm orderId, MockPay thêm merchantRef (id payment) và status.
      # Mặc định là trang /payments/return của web-app (npm run dev, cổng 5173). Chạy không có web-app thì đặt
      # http://localhost:8080/payments/return: trang dự phòng của core, chỉ báo "đang xác nhận".
      return-url: http://localhost:5173/payments/return
      notify-url: http://localhost:8080/webhooks/payments/mockpay
      connect-timeout: PT2S
      read-timeout: PT5S
  outbox:
    relay:
      enabled: true
      interval: PT0.5S
    retention: P7D                # xoá outbox đã gửi sau 7 ngày
  ticket:
    transfer-cutoff: PT2H         # không cho chuyển nhượng trong 2 giờ trước giờ diễn
  qr:
    active-key-id: k1
    private-key: ${QR_PRIVATE_KEY}        # Ed25519 PKCS#8 DER, base64
    public-keys:
      k1: ${QR_PUBLIC_KEY}                # Ed25519 X.509 DER, base64
  jwt:
    # Token do identity-service phát (RS256). core chỉ kiểm tra, lấy public key từ JWKS của identity.
    issuer: ticket2h
    jwk-set-uri: http://localhost:8082/.well-known/jwks.json
  identity-api:
    # Tra tài khoản theo email (chuyển nhượng vé, phân công soát vé). Khoá của core: X-Internal-Api-Key
    base-url: http://localhost:8082
    api-key: ${INTERNAL_API_KEY_CORE}
    connect-timeout: PT2S
    read-timeout: PT5S
  internal-api:
    # Service nào được gọi /internal/** và bằng khoá nào (header X-Internal-Api-Key). Xem infra/docs/contracts.md
    clients:
      notification-service: ${INTERNAL_API_KEY_NOTIFICATION}
