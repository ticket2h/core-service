# Mỗi lần push hoặc mở pull request: chạy toàn bộ test (./mvnw verify, Testcontainers dùng Docker có sẵn trên runner).
# Push lên main mà test xanh: build image và đẩy lên GitHub Container Registry (ghcr.io/<owner>/<repo>),
# tag "latest" và "sha-<7 ký tự commit>". infra/docker-compose.yml kéo image này về để chạy cả hệ thống.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        run: ./mvnw -B verify
      # Mỗi test đỏ thành một annotation (tên test, đầu thông báo lỗi): thấy ngay trên trang tổng quan của run,
      # đọc được qua API công khai của GitHub không cần đăng nhập (log, artifact phải đăng nhập mới tải được)
      - name: Báo test đỏ thành annotation
        if: failure()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET

          def escape(text, prop=False):
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              return text.replace(':', '%3A').replace(',', '%2C') if prop else text

          for path in sorted(glob.glob('target/*-reports/TEST-*.xml')):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in case.findall('failure') + case.findall('error'):
                      lines = (problem.get('message') or problem.text or problem.get('type') or '').strip().splitlines()
                      name = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::error title={escape(name, True)}::{escape(chr(10).join(lines[:6])[:1000])}")
      - name: Lưu báo cáo test khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
